services:
  db:
    image: postgres:16-alpine
    container_name: hekim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hekim
      POSTGRES_PASSWORD: hekim_password
      POSTGRES_DB: hekim_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
